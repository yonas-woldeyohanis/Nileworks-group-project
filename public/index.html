<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nileworks Group Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            margin: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #764ba2;
        }
        .status {
            margin-top: 30px;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Nileworks Group Project</h1>
        <p>Welcome to the Nileworks Group Project! This is a modern web application built with Node.js and Express.</p>
        <div>
            <a href="https://github.com/yonas-woldeyohanis/Nileworks-group-project" class="btn">View Repository</a>
            <a href="/api/status" class="btn">Check API Status</a>
        </div>
        <div class="status">
            <p><strong>Server Status:</strong> Running ✅</p>
            <p id="timestamp">Loading timestamp...</p>
        </div>
    </div>
    <script>
        fetch('/api/status')
            .then(response => response.json())
            .then(data => {
                document.getElementById('timestamp').textContent = `Last updated: ${data.timestamp}`;
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
